<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso administrativo | UAM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/imagenes.css') }}"
    >

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo-main">
                UAM
            </div>

            <span class="eyebrow">
                PERSONAL / ADMINISTRADOR
            </span>

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Ingresa tus credenciales para acceder
                al panel administrativo.
            </p>


            {% if error %}

                <div class="message error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                action="{{ url_for('login') }}"
                method="POST"
                class="form-stack"
            >

                <div class="form-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Iniciar sesión
                </button>

            </form>


            <a
                href="{{ url_for('inicio') }}"
                class="btn btn-back btn-full login-back"
            >
                ← Volver
            </a>

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='js/scripts.js') }}"
    ></script>

</body>

</html>
